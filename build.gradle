plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java-library'	// api와 implementation을 구분하는 라이브러리용 plugin
	id 'maven-publish'	// 배포를 위한 plugin
}

group = 'com.portfolio.common'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	// GitHub Packages 사용
	maven{
		name = "GitHubPackages"
		def repoPath = System.getenv("GPR_SYS_PATH") ?: project.findProperty("gpr.sys.path")
		// URL: https://maven.pkg.github.com/{조직명}/{저장소}
		url = "https://maven.pkg.github.com/${repoPath}"
		credentials{
			// CI환경(github actions)과 로컬PC 모두 지원하는 방식
			username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
			password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token")
		}
	}

	mavenCentral()
}

dependencies {
	api 'com.portfolio.common:system:0.0.1-SNAPSHOT'				// system common 라이브러리
	api 'org.springframework.boot:spring-boot-starter-security'		// SpringSecurity
	api 'org.springframework.boot:spring-boot-starter-data-jpa'		// JPA
	// @JsonSerialize, @JacksonAnnotationsInside 등 핵심 어노테이션과 기능을 제공
	api 'com.fasterxml.jackson.core:jackson-databind'

	// JAXB API: XML 데이터를 자바 객체로 매핑하기 위한 표준 인터페이스
	api 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
// JAXB 구현체: 실제 XML 파싱을 수행하는 라이브러리
	api 'org.glassfish.jaxb:jaxb-runtime:4.0.2'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// @SpringBootTest를 사용할 때 필요한 자동 설정 관련 클래스들을 포함시키기 위해 추가합니다.
	// testImplementation은 이 의존성이 '테스트'를 실행할 때만 사용된다는 의미입니다.
	testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
}

dependencyManagement {
	imports {
		// Spring Boot3.5.4가 권장하는 버전들을 자동으로 관리
		mavenBom("org.springframework.boot:spring-boot-dependencies:3.5.4")
	}
}

// publishing 설정: GitHubPackages로 배포하기 위한 핵심
publishing {
	publications {
		maven(MavenPublication) {
			from components.java

			// github packages 사용을 위한 명확히 표기
			groupId = 'com.portfolio.common'
			artifactId = 'business'    // 원하는 artifactId 명확히 지정
			version = '0.0.1-SNAPSHOT'

			// version mapping
			versionMapping {
				// 'api'로 선언된 의존성에 대한 버전 매핑
				usage('java-api') {
					fromResolutionResult()
				}
				// 'implementation' 선언된 의존성에 대한 버전 매핑
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
	repositories {
		maven {
			name = "GitHubPackages"
			// System.getenv = .github/workflows/publish.yml의 env 설정
			def repoPath = System.getenv("GPR_BIZ_PATH") ?: project.findProperty("gpr.sys.path")
			// URL: https://maven.pkg.github.com/{조직명}/{저장소}
			url = "https://maven.pkg.github.com/${repoPath}"
			credentials {
				// CI환경(github actions)과 로컬PC 모두 지원하는 방식
				username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
				password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token")
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
